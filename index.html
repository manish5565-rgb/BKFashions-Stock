<title>BK Fashions ERP</title>

<style>
/* ── FOOD-APP THEME ──────────────────────────────────────────────────────────
   Cream bg · pure white cards · bold orange accent · rounded everything
   Inspired by the Delicious Food delivery app UI
──────────────────────────────────────────────────────────────────────────── */
:root{
  --bg:#f5f5f0;
  --surf:#ffffff;
  --card:#ffffff;
  --bdr:#eeeeee;
  --bdr2:#e5e5e5;

  --ora:#e07520;        /* main orange */
  --ora2:#f4874b;       /* lighter orange */
  --ora3:#fff0e6;       /* orange tint bg */
  --oras:rgba(224,117,32,.13);

  --red:#e05252;
  --reds:rgba(224,82,82,.12);
  --grn:#3dab6e;
  --grns:rgba(61,171,110,.12);
  --gld:#e8a820;
  --glds:rgba(232,168,32,.12);
  --sky:#4e9de8;
  --skys:rgba(78,157,232,.12);

  --txt:#1a1a1a;
  --txt2:#555555;
  --mut:#aaaaaa;
  --lbl:#999999;

  --sh:0 2px 16px rgba(0,0,0,.07);
  --sh2:0 4px 28px rgba(0,0,0,.10);
  --sh3:0 8px 32px rgba(224,117,32,.28);

  --r:18px;
  --r2:14px;
  --r3:50px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:var(--bg);color:var(--txt);font-family:'Poppins',sans-serif;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:#ddd;border-radius:4px}
button,input,select{font-family:inherit}
button{cursor:pointer}
img{display:block;max-width:100%}

/* ── LAYOUT ────────────────────────────────────────────────────────────────── */
#shell{display:flex;flex-direction:column;min-height:100vh;max-width:480px;margin:0 auto;position:relative}
#topbar{position:sticky;top:0;z-index:40;background:rgba(245,245,240,.96);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--bdr);padding:13px 20px;
  display:none;justify-content:space-between;align-items:center}
#main{flex:1;padding:0 0 90px;overflow-x:hidden}
#nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);
  width:100%;max-width:480px;background:var(--surf);
  border-top:1px solid var(--bdr);box-shadow:0 -2px 20px rgba(0,0,0,.08);
  display:none;z-index:50;padding-bottom:env(safe-area-inset-bottom,0)}

/* ── OVERLAY ───────────────────────────────────────────────────────────────── */
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.38);backdrop-filter:blur(3px);
  z-index:100;display:none;align-items:flex-end;justify-content:center}
#overlay.on{display:flex}
#mbox{background:var(--surf);border-radius:28px 28px 0 0;width:100%;max-width:480px;
  padding:10px 20px 24px;max-height:92vh;overflow-y:auto;
  box-shadow:0 -4px 40px rgba(0,0,0,.14)}
/* drag handle */
#mbox::before{content:'';display:block;width:40px;height:4px;border-radius:2px;
  background:#ddd;margin:0 auto 18px}

/* ── TOAST ─────────────────────────────────────────────────────────────────── */
#toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);
  border-radius:50px;padding:10px 22px;font-size:13px;font-weight:600;
  z-index:300;white-space:nowrap;display:none;
  box-shadow:0 4px 20px rgba(0,0,0,.18)}

/* ── ANIMATIONS ────────────────────────────────────────────────────────────── */
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.fu{animation:fadeUp .3s ease}
@keyframes slideUp{from{transform:translateY(110%);opacity:0}to{transform:translateY(0);opacity:1}}
.su{animation:slideUp .28s cubic-bezier(.32,.72,0,1)}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.12)}100%{transform:scale(1)}}
.pop{animation:pop .18s ease}

/* ── BADGES ────────────────────────────────────────────────────────────────── */
.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:50px;font-size:10px;font-weight:700;letter-spacing:.4px}
.b-ora{background:var(--oras);color:var(--ora)}
.b-sky{background:var(--skys);color:var(--sky)}
.b-grn{background:var(--grns);color:var(--grn)}
.b-red{background:var(--reds);color:var(--red)}
.b-gld{background:var(--glds);color:var(--gld)}

/* ── BUTTONS ───────────────────────────────────────────────────────────────── */
.btn{border:none;border-radius:var(--r3);padding:14px 20px;font-weight:700;font-size:14px;
  cursor:pointer;transition:transform .12s,box-shadow .12s;letter-spacing:.3px}
.btn:active{transform:scale(.97)}
.btn-ora{background:var(--ora);color:#fff;box-shadow:var(--sh3)}
.btn-ora:hover{background:var(--ora2)}
.btn-ghost{background:var(--bg);color:var(--txt2);border:1.5px solid var(--bdr2)}
.btn-sky{background:var(--sky);color:#fff;box-shadow:0 4px 16px rgba(78,157,232,.28)}

/* orange circle button (FAB style) */
.btn-fab{width:42px;height:42px;border-radius:50%;background:var(--ora);color:#fff;
  border:none;display:flex;align-items:center;justify-content:center;
  box-shadow:var(--sh3);cursor:pointer;flex-shrink:0;transition:transform .12s}
.btn-fab:active{transform:scale(.92)}

/* qty buttons */
.qty-btn{width:30px;height:30px;border-radius:50%;background:var(--ora);color:#fff;
  border:none;font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 8px rgba(224,117,32,.3);line-height:1;flex-shrink:0}

/* ── INPUTS ────────────────────────────────────────────────────────────────── */
.inp{width:100%;background:var(--bg);border:1.5px solid var(--bdr2);border-radius:var(--r2);
  padding:12px 15px;color:var(--txt);font-size:14px;outline:none;font-family:'Poppins',sans-serif;
  transition:border-color .2s,box-shadow .2s}
.inp:focus{border-color:var(--ora);box-shadow:0 0 0 3px var(--oras)}
.lbl{display:block;font-size:11px;color:var(--lbl);font-weight:600;letter-spacing:.7px;margin-bottom:6px;text-transform:uppercase}

/* search bar (food-app style) */
.search-bar{display:flex;align-items:center;gap:10px;background:var(--bg);
  border:none;border-radius:var(--r3);padding:11px 16px;
  box-shadow:var(--sh)}

/* ── CARDS ─────────────────────────────────────────────────────────────────── */
.card{background:var(--surf);border-radius:var(--r);box-shadow:var(--sh);border:none}
.card2{background:var(--surf);border-radius:var(--r2);box-shadow:var(--sh);border:none}
.incard{background:var(--bg);border-radius:var(--r2);border:1.5px solid var(--bdr2)}

/* ── CATEGORY PILL ─────────────────────────────────────────────────────────── */
.cat-pill{display:flex;align-items:center;gap:6px;padding:7px 16px;border-radius:50px;
  font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;
  border:none;transition:transform .12s,box-shadow .12s}
.cat-pill:active{transform:scale(.95)}
.cat-pill.active{background:var(--ora);color:#fff;box-shadow:var(--sh3)}
.cat-pill.inactive{background:var(--surf);color:var(--txt2);box-shadow:var(--sh)}

/* ── IMAGE WRAPPER ─────────────────────────────────────────────────────────── */
.imgw{position:relative;overflow:hidden;flex-shrink:0;background:var(--bg)}
.imgw img{width:100%;height:100%;object-fit:cover;display:block}
.imgph{display:none;position:absolute;inset:0;align-items:center;justify-content:center;background:var(--bg)}
.imgw img.err + .imgph{display:flex}

/* circular image (food-app product cards) */
.img-circle{border-radius:50%;overflow:hidden;flex-shrink:0}

/* ── STAT CARD ─────────────────────────────────────────────────────────────── */
.stat{background:var(--surf);border-radius:var(--r);padding:16px 14px;box-shadow:var(--sh)}

/* ── PRODUCT ROW (order-detail style) ─────────────────────────────────────── */
.prow{background:var(--surf);border-radius:var(--r);box-shadow:var(--sh);
  display:flex;align-items:center;gap:14px;padding:14px}

/* ── SECTION TITLE ─────────────────────────────────────────────────────────── */
.sec-title{font-size:16px;font-weight:700;color:var(--txt);margin-bottom:12px}

/* ── PHOTO PICKER ──────────────────────────────────────────────────────────── */
.photo-choice{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:7px;border-radius:var(--r2);padding:18px 8px;
  background:var(--bg);border:2px dashed var(--bdr2);cursor:pointer;
  transition:border-color .2s,background .2s}
.photo-choice:hover{border-color:var(--ora);background:var(--oras)}

/* ── GREETING STRIP (food-app hello header) ─────────────────────────────────  */
.greet{padding:20px 20px 16px;display:flex;justify-content:space-between;align-items:flex-start}

/* ── SIZE TABLE ─────────────────────────────────────────────────────────────── */
.sz-tbl{width:100%;border-collapse:collapse;font-size:13px}
.sz-tbl th{padding:8px 10px;text-align:center;font-size:10px;font-weight:700;
  color:var(--lbl);letter-spacing:.5px;text-transform:uppercase;border-bottom:1px solid var(--bdr)}
.sz-tbl td{padding:9px 10px;text-align:center;border-bottom:1px solid var(--bdr)}

/* ── DIV LINE ──────────────────────────────────────────────────────────────── */
.hr{border:none;border-top:1.5px dashed var(--bdr2);margin:14px 0}
</style>

function doLogin(){
  var u=document.getElementById("lu").value.trim(), p=document.getElementById("lp").value, f=null;
  for(var i=0;i<USERS.length;i++){if(USERS[i].u===u&&USERS[i].pw===p){f=USERS[i];break;}}
  if(!f){document.getElementById("lerr").style.display="block";return;}
  CU=f; initApp();
}
function doLogout(){CU=null;tab="dashboard";q="";cat="All";renderLogin();}

// ── APP SHELL ──────────────────────────────────────────────────────────────────
function initApp(){
  var tb=document.getElementById("topbar");
  tb.style.display="flex";
  document.getElementById("tb-role").textContent=CU.role;
  document.getElementById("tb-role").className="badge "+(CU.role==="admin"?"b-ora":"b-sky");
  document.getElementById("tb-avatar").textContent=CU.name[0].toUpperCase();
  document.getElementById("logout-btn").addEventListener("click",doLogout);

  var tabs=[
    {id:"dashboard",lbl:"Home",   icon:IC.home},
    {id:"inventory",lbl:"Stock",  icon:IC.box},
    {id:"reports",  lbl:"Reports",icon:IC.bar},
  ];
  if(CU.role==="admin") tabs.push({id:"users",lbl:"Users",icon:IC.usrs});

  var nav=document.getElementById("nav");
  nav.style.display="flex";
  // food-app style: center item is a big orange FAB
  var mid=Math.floor(tabs.length/2);
  nav.innerHTML=tabs.map(function(t,i){
    if(i===mid && tabs.length===4){
      // insert FAB placeholder spacing
    }
    return '<button data-tab="'+t.id+'" style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;'+
      'padding:11px 4px 8px;background:none;border:none;color:var(--mut);cursor:pointer;transition:color .15s">'+
      si(t.icon,21)+
      '<span style="font-size:9px;font-weight:700;letter-spacing:.3px">'+t.lbl+'</span>'+
      '<div style="width:5px;height:5px;border-radius:50%;background:var(--ora);opacity:0;margin-top:1px;transition:opacity .15s"></div>'+
    '</button>';
  }).join("");

  nav.querySelectorAll("[data-tab]").forEach(function(btn){
    btn.addEventListener("click",function(){gotoTab(btn.dataset.tab);});
  });
  gotoTab("dashboard");
}

function gotoTab(id){
  tab=id; q=""; cat="All";
  document.querySelectorAll("[data-tab]").forEach(function(btn){
    var a=btn.dataset.tab===id;
    btn.style.color=a?"var(--ora)":"var(--mut)";
    btn.querySelectorAll("svg").forEach(function(s){s.setAttribute("stroke",a?"var(--ora)":"var(--mut)");});
    btn.querySelectorAll("div").forEach(function(d){d.style.opacity=a?"1":"0";});
  });
  var m=document.getElementById("main"); m.scrollTop=0;
  if(id==="dashboard")      m.innerHTML=dashHTML();
  else if(id==="inventory") {m.innerHTML=invHTML(); bindInv();}
  else if(id==="reports")   m.innerHTML=repHTML();
  else if(id==="users")     m.innerHTML=usersHTML();
}

function getFilt(){
  return DB.filter(function(p){
    return (cat==="All"||p.cat===cat)&&
      (p.name.toLowerCase().indexOf(q)>=0||p.sku.toLowerCase().indexOf(q)>=0);
  });
}

function dashHTML(){
  var stk=DB.reduce(function(a,p){return a+SS(p);},0);
  var sld=DB.reduce(function(a,p){return a+SD(p);},0);
  var low=DB.filter(LW).length;
  var rev=DB.reduce(function(a,p){return a+SD(p)*p.price;},0);
  var bySz=SIZES.map(function(s){return {s:s,v:DB.reduce(function(a,p){return a+(p.sold[s]||0);},0)};});
  var mx=Math.max.apply(null,bySz.map(function(x){return x.v;})); if(mx<1)mx=1;

  function sc(lbl,val,sub,icon,color,bgc){

  var lowBanner="";

function bindInv(){
  var s=document.getElementById("srch");
  if(s) s.addEventListener("input",function(){q=this.value.toLowerCase().trim();refreshList();});
  var ab=document.getElementById("addbtn");
  if(ab) ab.addEventListener("click",openAddModal);
  var mc=document.getElementById("manage-cat-btn");
  if(mc) mc.addEventListener("click",openCatModal);
  document.querySelectorAll("[data-cat]").forEach(function(btn){
    btn.addEventListener("click",function(){
      cat=btn.dataset.cat;
      document.getElementById("main").innerHTML=invHTML(); bindInv();
    });
  });
  bindCBtns();
}

function refreshList(){
  var list=getFilt();
  var pl=document.getElementById("plist"), pc=document.getElementById("pcount");
  if(pl) pl.innerHTML=list.length?list.map(pCard).join(""):
    '<div style="text-align:center;padding:56px 20px"><div style="font-size:48px;margin-bottom:12px">📦</div><p style="color:var(--mut);font-size:14px;font-weight:600">No products found</p></div>';
  if(pc) pc.textContent=list.length+" product"+(list.length!==1?"s":"");
  bindCBtns();
}

function bindCBtns(){
  document.querySelectorAll("[data-toggle]").forEach(function(el){
    el.addEventListener("click",function(){toggleCard(+el.dataset.toggle);});
  });
  document.querySelectorAll("[data-sale]").forEach(function(el){
    el.addEventListener("click",function(e){e.stopPropagation();openSaleModal(+el.dataset.sale);});
  });
  document.querySelectorAll("[data-edit]").forEach(function(el){
    el.addEventListener("click",function(e){e.stopPropagation();openEditModal(+el.dataset.edit);});
  });
}

function toggleCard(id){
  var el=document.getElementById("exp"+id);

  el.style.display=open?"block":"none";
  if(open) bindCBtns();
}

// ── SALE MODAL ─────────────────────────────────────────────────────────────────
var sPid, sS="M", sN=1;
function openSaleModal(id){
  sPid=id;
  var p=DB.filter(function(x){return x.id===id;})[0];
  var pS=PS(p);
  sS = pS.indexOf("M")>=0 ? "M" : pS[0];
  sN=1;
  renderSaleModal();
}

function renderSaleModal(){
  var p=DB.filter(function(x){return x.id===sPid;})[0];
  var pSizes=PS(p);
  // Reset sS to first size if current one isn't valid for this product
  if(pSizes.indexOf(sS)<0) sS=pSizes[0];
  var av=p.stock[sS]||0, ok=sN>=1&&sN<=av&&av>0;

  var szBtns=pSizes.map(function(s){
    var a=s===sS, qty=p.stock[s]||0, lo=qty<5;
    return '<button data-sz="'+E(s)+'" style="flex:1;padding:10px 2px;border-radius:var(--r3);'+
      'font-size:12px;font-weight:700;cursor:pointer;font-family:Poppins;'+
      'background:'+(a?"var(--ora)":"var(--bg)")+
      ';color:'+(a?"#fff":(lo?"var(--red)":"var(--txt2)"))+
      ';border:'+(a?"none":"1.5px solid var(--bdr2)")+
      ';box-shadow:'+(a?"var(--sh3)":"none")+'">'+
      E(s)+(lo&&!a?'<br/><span style="font-size:8px">'+qty+'</span>':'')+
    '</button>';
  }).join("");

  openModal(
    '<div style="display:flex;align-items:center;gap:14px;margin-bottom:20px">'+
      circ(p,60)+
      '<div>'+
        '<p style="font-size:17px;font-weight:800;color:var(--txt)">'+E(p.name)+'</p>'+
        '<p style="font-size:12px;color:var(--mut);margin-top:2px">'+E(p.cat)+' &bull; <span style="color:var(--ora);font-weight:700">$'+p.price.toFixed(2)+'</span>'+(p.fabric?' &bull; '+E(p.fabric):'')+'</p>'+
      '</div>'+
    '</div>'+
    '<p class="lbl">Select Size</p>'+
    '<div style="display:flex;gap:7px;margin-bottom:18px">'+szBtns+'</div>'+
    '<div style="background:var(--bg);border-radius:var(--r2);padding:12px 16px;margin-bottom:18px;font-size:13px;font-weight:600;color:var(--txt2)">'+
      'Available in <strong style="color:var(--txt)">'+sS+'</strong>: '+
      '<strong style="color:'+(av<1?"var(--red)":"var(--grn)")+'">'+av+' units</strong>'+
    '</div>'+
    '<p class="lbl">Quantity</p>'+
    // qty control – food-app style: [–] number [+]
    '<div style="display:flex;align-items:center;justify-content:center;gap:20px;background:var(--bg);border-radius:var(--r);padding:14px;margin-bottom:22px">'+
      '<button id="qdn" class="qty-btn">&#8722;</button>'+
      '<span style="font-size:32px;font-weight:800;color:var(--txt);min-width:50px;text-align:center">'+sN+'</span>'+
      '<button id="qup" class="qty-btn">&#43;</button>'+
    '</div>'+
    // total
    '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">'+
      '<span style="font-size:14px;color:var(--mut);font-weight:600">Total Amount</span>'+
      '<span style="font-size:22px;font-weight:900;color:var(--ora)">$'+(p.price*sN).toFixed(2)+'</span>'+
    '</div>'+
    '<button id="csale"'+(ok?'':' disabled')+' class="btn btn-ora" style="width:100%;font-size:15px;font-weight:800;letter-spacing:.4px;'+(ok?'':'opacity:.45;cursor:default;')+'">'+
      (av<1?'Out of Stock':'CONFIRM SALE')+
    '</button>'+
    '<button id="xsale" style="width:100%;background:none;border:none;color:var(--mut);margin-top:12px;padding:9px;font-size:13px;cursor:pointer;font-weight:600">Cancel</button>'
  );

  document.querySelectorAll("[data-sz]").forEach(function(b){
    b.addEventListener("click",function(){sS=b.dataset.sz;sN=1;renderSaleModal();});
  });
  document.getElementById("qdn").addEventListener("click",function(){sN=Math.max(1,sN-1);renderSaleModal();});
  document.getElementById("qup").addEventListener("click",function(){
    sN=Math.min(DB.filter(function(x){return x.id===sPid;})[0].stock[sS]||0,sN+1);renderSaleModal();
  });
  if(ok){
    document.getElementById("csale").addEventListener("click",function(){
      var p2=DB.filter(function(x){return x.id===sPid;})[0];
      p2.stock[sS]=(p2.stock[sS]||0)-sN;
      p2.sold[sS]=(p2.sold[sS]||0)+sN;
      closeModal();
      toast("&#10003; "+sN+"&times;"+sS+" "+p2.name+" sold","var(--grn)","#fff");
      if(tab==="inventory"){document.getElementById("main").innerHTML=invHTML();bindInv();}
      else gotoTab(tab);
    });
  }
  document.getElementById("xsale").addEventListener("click",closeModal);
}

// ── EDIT MODAL ─────────────────────────────────────────────────────────────────
var ePid, eS={};
function openEditModal(id){
  var p=DB.filter(function(x){return x.id===id;})[0];
  ePid=id; eS={}; PS(p).forEach(function(s){eS[s]=p.stock[s]||0;});
  renderEditModal();
}
function renderEditModal(){
  var p=DB.filter(function(x){return x.id===ePid;})[0];
  var pSizes=PS(p);
  // Use safe IDs (avoid special chars in size names)
  var rows=pSizes.map(function(s,i){
    var v=eS[s]||0, lo=v<5;
    return '<div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--bdr)">'+
      '<span style="width:46px;font-weight:800;color:var(--txt);font-size:14px;text-align:center">'+E(s)+'</span>'+
      '<button data-adj="'+E(s)+'" data-d="-1" class="qty-btn" style="width:32px;height:32px">&#8722;</button>'+
      '<input type="number" data-eidx="'+i+'" data-esz="'+E(s)+'" value="'+v+'" min="0" '+
        'style="flex:1;background:var(--bg);border:1.5px solid var(--bdr2);border-radius:10px;padding:7px 10px;color:var(--txt);text-align:center;font-size:16px;font-weight:800;outline:none;font-family:Poppins"/>'+
      '<button data-adj="'+E(s)+'" data-d="1" class="qty-btn" style="width:32px;height:32px">&#43;</button>'+
      (lo?'<span class="badge b-red" style="flex-shrink:0">Low</span>':'<span style="width:36px;flex-shrink:0"></span>')+
    '</div>';
  }).join("");

  openModal(
    '<div style="display:flex;align-items:center;gap:14px;margin-bottom:18px">'+
      circ(p,52)+
      '<div><p style="font-size:16px;font-weight:800;color:var(--txt)">'+E(p.name)+'</p><p style="font-size:12px;color:var(--mut)">'+E(p.sku)+'</p></div>'+
    '</div>'+
    '<p class="lbl" style="margin-bottom:4px">Adjust Stock by Size</p>'+
    '<div style="margin-bottom:18px">'+rows+'</div>'+
    '<button id="csave" class="btn btn-ora" style="width:100%;font-size:15px;font-weight:800">SAVE CHANGES</button>'+
    '<button id="xedit" style="width:100%;background:none;border:none;color:var(--mut);margin-top:12px;padding:8px;font-size:13px;cursor:pointer;font-weight:600">Cancel</button>'
  );

  document.querySelectorAll("[data-adj]").forEach(function(b){
    b.addEventListener("click",function(){
      var s=b.dataset.adj, d=parseInt(b.dataset.d);
      eS[s]=Math.max(0,(eS[s]||0)+d); renderEditModal();
    });
  });
  document.querySelectorAll("[data-esz]").forEach(function(inp){
    inp.addEventListener("change",function(){eS[this.dataset.esz]=Math.max(0,parseInt(this.value)||0);renderEditModal();});
  });
  document.getElementById("csave").addEventListener("click",function(){
    var p2=DB.filter(function(x){return x.id===ePid;})[0];
    PS(p2).forEach(function(s){p2.stock[s]=eS[s]||0;});
    closeModal(); toast("&#10003; Stock updated","var(--sky)","#fff");
    if(tab==="inventory"){document.getElementById("main").innerHTML=invHTML();bindInv();}
    else gotoTab(tab);
  });
  document.getElementById("xedit").addEventListener("click",closeModal);
}

// ── ADD PRODUCT MODAL ──────────────────────────────────────────────────────────
// Per-modal mutable size list — copied from DEFAULT_SIZES, can be added/removed
var newSizes = [];
var newSizeQty = {};

function openAddModal(){
  addImg="";
  // Start with default sizes copied
  newSizes = DEFAULT_SIZES.slice();
  newSizeQty = {};
  newSizes.forEach(function(s){ newSizeQty[s] = 0; });

  var cOpts=CATS.slice(1).map(function(c){return '<option>'+E(c)+'</option>';}).join("");

function renderSizeGrid(){
  var grid=document.getElementById("size-grid");
  if(!grid) return;
  grid.innerHTML = newSizes.map(function(s){
    return '<div class="incard" style="padding:9px 11px;position:relative">'+
      '<button type="button" class="rm-size" data-s="'+E(s)+'" style="position:absolute;top:5px;right:5px;'+
        'background:var(--reds);color:var(--red);border:none;border-radius:50%;width:18px;height:18px;'+
        'font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:0">'+
        si(IC.x,9,"var(--red)","2.5")+'</button>'+
      '<div class="lbl" style="margin-bottom:4px">'+E(s)+'</div>'+
      '<input type="number" class="ns-inp" data-s="'+E(s)+'" value="'+(newSizeQty[s]||0)+'" min="0" '+
        'style="width:100%;background:transparent;border:none;color:var(--txt);font-size:20px;font-weight:800;outline:none;font-family:Poppins"/>'+
    '</div>';
  }).join("");
  // bind remove
  grid.querySelectorAll(".rm-size").forEach(function(b){
    b.addEventListener("click",function(){
      var s=this.dataset.s;
      if(newSizes.length<=1){toast("At least one size is required","var(--red)","#fff");return;}
      newSizes=newSizes.filter(function(x){return x!==s;});
      delete newSizeQty[s];
      renderSizeGrid();
    });
  });
  // bind value update
  grid.querySelectorAll(".ns-inp").forEach(function(inp){
    inp.addEventListener("input",function(){
      newSizeQty[this.dataset.s]=Math.max(0,parseInt(this.value)||0);
    });
  });
}

function openAddSizeDialog(){
  // Inline mini-prompt inside the modal — appears above size grid
  var existing=document.getElementById("add-size-form");
  if(existing){existing.remove();return;}
  var grid=document.getElementById("size-grid");
  var form=document.createElement("div");
  form.id="add-size-form";
  form.style.cssText="background:var(--oras);border:1.5px dashed var(--ora);border-radius:var(--r2);padding:10px;margin-bottom:8px;display:flex;gap:8px;align-items:center";
  form.innerHTML=
    '<input id="new-size-input" placeholder="e.g. 3XL, 28, 32, M-Tall…" class="inp" style="flex:1;background:#fff;font-size:13px;padding:8px 11px" maxlength="8"/>'+
    '<button id="confirm-add-size" style="background:var(--ora);color:#fff;border:none;border-radius:10px;padding:8px 14px;font-size:12px;font-weight:700;cursor:pointer">Add</button>'+
    '<button id="cancel-add-size" style="background:none;border:none;color:var(--mut);padding:4px;cursor:pointer;line-height:0">'+si(IC.x,14,"var(--mut)")+'</button>';
  grid.parentNode.insertBefore(form,grid);
  var inp=document.getElementById("new-size-input");
  inp.focus();
  function commit(){
    var v=inp.value.trim().toUpperCase();
    if(!v) return;
    if(newSizes.indexOf(v)>=0){toast("Size "+v+" already exists","var(--red)","#fff");return;}
    newSizes.push(v);
    newSizeQty[v]=0;
    form.remove();
    renderSizeGrid();
  }
  inp.addEventListener("keydown",function(e){if(e.key==="Enter")commit();if(e.key==="Escape")form.remove();});
  document.getElementById("confirm-add-size").addEventListener("click",commit);
  document.getElementById("cancel-add-size").addEventListener("click",function(){form.remove();});
}

// ── EXCEL EXPORT WITH IMAGES ───────────────────────────────────────────────────
async function exportExcel(){
  if(typeof ExcelJS==="undefined"||typeof saveAs==="undefined"){
    toast("Export libraries failed to load — check your connection","var(--red)","#fff");
    return;
  }
  var btn=document.getElementById("dl-xlsx-btn");
  if(btn){
    btn.disabled=true;
    btn.innerHTML=si(IC.dl,15,"#fff")+'<span>Exporting…</span>';
  }
  try{
    var wb=new ExcelJS.Workbook();
    wb.creator="BK Fashions ERP";
    wb.created=new Date();

    // ── Sheet 1: Stock Summary ──
    var ws=wb.addWorksheet("Stock Summary",{
      pageSetup:{paperSize:9,orientation:"landscape"}
    });

    // collect all sizes used across DB (union)
    var allSizesSet={};
    DB.forEach(function(p){PS(p).forEach(function(s){allSizesSet[s]=1;});});
    var allSizes=Object.keys(allSizesSet).sort(function(a,b){
      var order={"XS":1,"S":2,"M":3,"L":4,"XL":5,"XXL":6,"XXXL":7,"3XL":7};
      var ao=order[a]||99, bo=order[b]||99;
      if(ao!==bo) return ao-bo;
      return a.localeCompare(b);
    });

    // headers
    var headers=["Photo","Product Name","Category","SKU","Fabric","Price ($)"];
    allSizes.forEach(function(s){headers.push(s+" Stock");headers.push(s+" Sold");});
    headers.push("Total Stock","Total Sold","Revenue ($)","Sell-through (%)","Status");

    ws.addRow(headers);

    // header style
    var hRow=ws.getRow(1);
    hRow.height=28;
    hRow.eachCell(function(cell){
      cell.fill={type:"pattern",pattern:"solid",fgColor:{argb:"FFE07520"}};
      cell.font={bold:true,color:{argb:"FFFFFFFF"},size:11,name:"Calibri"};
      cell.alignment={vertical:"middle",horizontal:"center",wrapText:true};
      cell.border={top:{style:"thin",color:{argb:"FFFFFFFF"}},bottom:{style:"thin",color:{argb:"FFFFFFFF"}}};
    });

    // column widths
    ws.getColumn(1).width=12;  // Photo
    ws.getColumn(2).width=26;  // Name
    ws.getColumn(3).width=14;  // Category
    ws.getColumn(4).width=12;  // SKU
    ws.getColumn(5).width=20;  // Fabric
    ws.getColumn(6).width=11;  // Price
    for(var i=0;i<allSizes.length*2;i++){
      ws.getColumn(7+i).width=10;
    }
    var totalsStartCol=7+allSizes.length*2;
    for(var j=0;j<5;j++){
      ws.getColumn(totalsStartCol+j).width=14;
    }

    // ── Add product rows + embedded images ──
    for(var idx=0;idx<DB.length;idx++){
      var p=DB[idx], rowNum=idx+2;
      var pSizes=PS(p), ts=SS(p), tsold=SD(p);
      var pct=ts+tsold>0?Math.round(tsold/(ts+tsold)*100):0;
      var rev=tsold*p.price;
      var status=LW(p)?"⚠ Low Stock":"✓ OK";

      var rowData=["",p.name,p.cat,p.sku,p.fabric||"—",p.price];
      allSizes.forEach(function(s){
        if(pSizes.indexOf(s)>=0){
          rowData.push(p.stock[s]||0);
          rowData.push(p.sold[s]||0);
        } else {
          rowData.push("—");
          rowData.push("—");
        }
      });
      rowData.push(ts,tsold,rev,pct,status);
      var row=ws.addRow(rowData);
      row.height=60;

      // Embed image
      try{
        var imgBuffer=await fetchImageBuffer(p.img);
        if(imgBuffer){
          var ext=imgBuffer.ext, b64=imgBuffer.b64;
          var imageId=wb.addImage({base64:"data:image/"+ext+";base64,"+b64,extension:ext});
          ws.addImage(imageId,{
            tl:{col:0.1,row:rowNum-1+0.05},
            ext:{width:70,height:70}
          });
        }
      }catch(e){
        // image failed — leave photo cell empty, continue
        console.warn("Image failed for",p.name,e);
      }

      // row styling
      row.eachCell(function(cell,colNum){
        cell.alignment={vertical:"middle",horizontal:colNum===2?"left":"center",wrapText:true};
        cell.font={size:10,name:"Calibri"};
        cell.border={
          top:{style:"thin",color:{argb:"FFE5E5E5"}},
          bottom:{style:"thin",color:{argb:"FFE5E5E5"}}
        };
        if(idx%2===0){
          cell.fill={type:"pattern",pattern:"solid",fgColor:{argb:"FFFAFAFA"}};
        }
      });

      // status cell color
      var statusCol=totalsStartCol+4;
      var sc=row.getCell(statusCol);
      sc.font={bold:true,size:10,color:{argb:LW(p)?"FFE05252":"FF3DAB6E"}};

      // revenue cell format
      var revCol=totalsStartCol+2;
      row.getCell(revCol).numFmt='"$"#,##0.00';
      row.getCell(6).numFmt='"$"#,##0.00';
      // sell-through %
      row.getCell(totalsStartCol+3).numFmt='0"%"';
    }

    // freeze header row
    ws.views=[{state:"frozen",ySplit:1,xSplit:2}];

    // ── Sheet 2: Sales Summary ──
    var ws2=wb.addWorksheet("Sales Summary");
    ws2.addRow(["BK Fashions — Stock Report"]).font={bold:true,size:16,color:{argb:"FFE07520"}};
    ws2.addRow(["Generated:",new Date().toLocaleString()]);
    ws2.addRow([]);
    ws2.addRow(["Total Products",DB.length]);
    ws2.addRow(["Total Units in Stock",DB.reduce(function(a,p){return a+SS(p);},0)]);
    ws2.addRow(["Total Units Sold",   DB.reduce(function(a,p){return a+SD(p);},0)]);
    ws2.addRow(["Total Revenue",      DB.reduce(function(a,p){return a+SD(p)*p.price;},0)]).getCell(2).numFmt='"$"#,##0.00';
    ws2.addRow(["Low Stock Items",    DB.filter(LW).length]);
    ws2.getColumn(1).width=24;
    ws2.getColumn(2).width=18;
    [4,5,6,7,8].forEach(function(r){ws2.getRow(r).font={bold:true};});

    // download
    var buf=await wb.xlsx.writeBuffer();
    var blob=new Blob([buf],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
    var stamp=new Date().toISOString().slice(0,10);
    saveAs(blob,"bkfashions-stock-report-"+stamp+".xlsx");
    toast("&#10003; Excel file downloaded","var(--grn)","#fff");
  }catch(err){
    console.error(err);
    toast("Export failed: "+err.message,"var(--red)","#fff");
  }finally{
    if(btn){
      btn.disabled=false;
      btn.innerHTML=si(IC.dl,15,"#fff")+'<span>Export</span>';
    }
  }
}

// fetch image, return base64 + extension
async function fetchImageBuffer(url){
  // Handle data URLs (uploaded camera/gallery photos)
  if(url.indexOf("data:image/")===0){
    var m=url.match(/^data:image\/(\w+);base64,(.+)$/);
    if(m){
      var ext=m[1].toLowerCase();
      if(ext==="jpg") ext="jpeg";
      return {ext:ext==="jpeg"?"jpeg":ext,b64:m[2]};
    }
    return null;
  }
  // Try fetching remote URL (may fail due to CORS)
  try{
    var resp=await fetch(url,{mode:"cors"});
    if(!resp.ok) throw new Error("HTTP "+resp.status);
    var blob=await resp.blob();
    var b64=await blobToBase64(blob);
    var ct=blob.type||"image/jpeg";
    var ext=ct.split("/")[1]||"jpeg";
    if(ext==="jpg") ext="jpeg";
    return {ext:ext,b64:b64};
  }catch(e){
    return null;
  }
}
function blobToBase64(blob){
  return new Promise(function(res,rej){
    var r=new FileReader();
    r.onloadend=function(){
      var dataUrl=r.result;
      var b64=dataUrl.split(",")[1];
      res(b64);
    };
    r.onerror=rej;
    r.readAsDataURL(blob);
  });
}
